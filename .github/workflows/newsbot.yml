name: Arasbaran News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  newsbot:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          echo "================================"
          echo "Installing dependencies"
          echo "================================"

          npm install

          echo "================================"
          echo "Dependencies installed"
          echo "================================"

      - name: Check project
        run: |
          echo "================================"
          echo "PROJECT CHECK"
          echo "================================"

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "--------------------------------"

          echo "Root:"
          ls -la

          echo "--------------------------------"

          echo "src:"
          ls -la src

          echo "--------------------------------"

          echo "config:"
          ls -la config

          echo "--------------------------------"

          echo "package.json:"
          cat package.json

          echo "================================"

      - name: Check Telegram Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: -1003955581255
        run: |
          echo "================================"
          echo "TELEGRAM CONFIGURATION CHECK"
          echo "================================"

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          echo "TELEGRAM_BOT_TOKEN: OK"

          if [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "ERROR: TELEGRAM_CHANNEL_ID is missing"
            exit 1
          fi

          echo "TELEGRAM_CHANNEL_ID: OK"

          echo "================================"

      - name: Test Node modules
        run: |
          echo "================================"
          echo "NODE MODULE TEST"
          echo "================================"

          node -e "require('rss-parser'); console.log('rss-parser: OK')"
          node -e "require('dotenv'); console.log('dotenv: OK')"
          node -e "require('cheerio'); console.log('cheerio: OK')"

          echo "================================"

      - name: Verify checked-out source
        run: |
          echo "================================"
          echo "SOURCE VERSION CHECK"
          echo "================================"
          echo "Commit:"
          git rev-parse HEAD
          echo "news.js SHA:"
          sha256sum src/news.js
          echo "Expected diagnostic markers:"
          grep -n "📡 RSS شروع\|🌐 HTML شروع" src/news.js || true
          echo "================================"

      - name: Test source configuration
        run: |
          echo "================================"
          echo "SOURCE CONFIGURATION TEST"
          echo "================================"

          node - <<'NODE'
          const fs = require('fs');

          const file = 'config/sources.json';

          console.log('Checking:', file);

          if (!fs.existsSync(file)) {
            console.error('ERROR: sources.json not found');
            process.exit(1);
          }

          const data = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          if (!data.sources || !Array.isArray(data.sources)) {
            console.error('ERROR: sources.json structure is invalid');
            process.exit(1);
          }

          console.log(
            'Sources found:',
            data.sources.length
          );

          for (const source of data.sources) {
            console.log(
              '-',
              source.id,
              '|',
              source.name,
              '|',
              source.enabled !== false ? 'enabled' : 'disabled'
            );
          }

          console.log('sources.json: OK');
          NODE

          echo "================================"

      - name: Test application modules
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: -1003955581255
          TIMEZONE: Asia/Tehran
          MAX_ITEMS_PER_SOURCE: 10
          MAX_TOTAL_ITEMS: 30
          NEWS_MAX_AGE_HOURS: 24
          MAX_HISTORY_ITEMS: 5000
          REQUEST_TIMEOUT: 25000
          DATA_FILE: data/news-history.json
        run: |
          echo "================================"
          echo "APPLICATION MODULE TEST"
          echo "================================"

          node - <<'NODE'
          console.log('Loading config...');
          require('./src/config');

          console.log('Loading sources...');
          require('./src/sources');

          console.log('Loading formatter...');
          require('./src/formatter');

          console.log('Loading storage...');
          require('./src/storage');

          console.log('Loading news...');
          require('./src/news');

          console.log('Loading telegram...');
          require('./src/telegram');

          console.log('ALL APPLICATION MODULES: OK');
          NODE

          echo "================================"

      - name: Test Telegram connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: -1003955581255
          TIMEZONE: Asia/Tehran
          MAX_ITEMS_PER_SOURCE: 10
          MAX_TOTAL_ITEMS: 30
          REQUEST_TIMEOUT: 25000
          DATA_FILE: data/news-history.json
        run: |
          echo "================================"
          echo "TELEGRAM CONNECTION TEST"
          echo "================================"

          node - <<'NODE'
          const { getMe } = require('./src/telegram');

          getMe()
            .then(bot => {
              console.log('Telegram connection: OK');
              console.log('Bot username:', bot.username || 'unknown');
            })
            .catch(error => {
              console.error('Telegram connection FAILED');
              console.error(error.message);
              process.exit(1);
            });
          NODE

          echo "================================"

      - name: Verify Telegram destination and send permission
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: -1003955581255
        run: |
          echo "================================"
          echo "TELEGRAM DESTINATION SEND TEST"
          echo "================================"
          node - <<'NODE'
          const { getMe, sendMessage, getChat, getChatAdministrators } = require('./src/telegram');
          const chatId = process.env.TELEGRAM_CHANNEL_ID;
          (async () => {
            try {
              const bot = await getMe();
              console.log('BOT USERNAME:', '@' + (bot.username || 'unknown'));
              const chat = await getChat(chatId);
              console.log('TARGET CHAT ID:', chat.id);
              console.log('TARGET CHAT TYPE:', chat.type);
              console.log('TARGET CHAT TITLE:', chat.title || '(no title)');
              console.log('TARGET CHAT USERNAME:', chat.username ? '@' + chat.username : '(private/no username)');
              if (String(chat.id) !== '-1003955581255') {
                throw new Error('مقصد Telegram اشتباه است؛ شناسه کانال موردنظر باید -1003955581255 باشد.');
              }
              if (chat.type !== 'channel') {
                throw new Error('مقصد Telegram کانال نیست؛ نوع مقصد: ' + chat.type);
              }
              console.log('BOT ID:', bot.id);
              console.log('Checking channel administrators...');
              try {
                const admins = await getChatAdministrators(chatId);
                const botAdmin = admins.find(a => a.user && a.user.id === bot.id);
                console.log('ADMIN COUNT:', admins.length);
                if (botAdmin) {
                  console.log('BOT ADMIN STATUS:', botAdmin.status);
                  console.log('BOT CAN POST:', botAdmin.can_post_messages === true ? 'YES' : 'NO/UNSPECIFIED');
                } else {
                  console.log('BOT ADMIN STATUS: NOT FOUND IN ADMINISTRATORS');
                }
              } catch (adminError) {
                console.log('ADMINISTRATOR CHECK FAILED:', adminError.message);
              }
              const marker = '🧪 تست اتصال ربات اخبار ارسباران';
              console.log('Sending temporary test message...');
              const sent = await sendMessage(marker);
              console.log('TELEGRAM SEND: OK');
              console.log('TEST MESSAGE ID:', sent.message_id);
              console.log('DESTINATION VERIFIED: CHANNEL');
              console.log('NOTE: test message will be removed only if deleteMessage is available.');
            } catch (error) {
              console.error('TELEGRAM DESTINATION SEND: FAILED');
              console.error(error.message);
              process.exit(1);
            }
          })();
          NODE
          echo "================================"
      - name: Run Arasbaran News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: -1003955581255
          TIMEZONE: Asia/Tehran
          MAX_ITEMS_PER_SOURCE: 10
          MAX_TOTAL_ITEMS: 30
          REQUEST_TIMEOUT: 25000
          NEWS_MAX_AGE_HOURS: 24
          DATA_FILE: data/news-history.json
        run: |
          echo "================================"
          echo "STARTING ARASBARAN NEWS BOT"
          echo "================================"

          node src/index.js

          echo "================================"
          echo "NEWS BOT FINISHED"
          echo "================================"

      - name: Check news history
        if: always()
        run: |
          echo "================================"
          echo "HISTORY CHECK"
          echo "================================"

          if [ -f data/news-history.json ]; then
            echo "History file exists."
            ls -lh data/news-history.json
            echo "--------------------------------"
            head -50 data/news-history.json
          else
            echo "History file does not exist."
          fi

          echo "================================"

      - name: Save news history
        if: success()
        run: |
          echo "================================"
          echo "SAVING NEWS HISTORY"
          echo "================================"

          if [ -f data/news-history.json ]; then

            git config user.name "Arasbaran News Bot"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/news-history.json

            if git diff --cached --quiet; then
              echo "No history changes."
            else
              git commit -m "Update news history"
              git push
            fi

          else
            echo "No history file to save."
          fi

          echo "================================"
