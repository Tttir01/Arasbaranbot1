name: Arasbaran News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  newsbot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Arasbaran News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TIMEZONE: Asia/Tehran
          MAX_ITEMS_PER_SOURCE: 10
          MAX_TOTAL_ITEMS: 30
          REQUEST_TIMEOUT: 25000
          DATA_FILE: data/news-history.json
        run: |
          echo "================================"
          echo "Starting Arasbaran News Bot"
          echo "================================"
          npm run run
          echo "================================"
          echo "News bot finished"
          echo "================================"

      - name: Check news history
        if: always()
        run: |
          echo "Checking history file..."

          if [ -f data/news-history.json ]; then
            echo "History file exists."
            ls -lh data/news-history.json
            echo "--------------------------------"
            head -50 data/news-history.json
          else
            echo "History file does not exist."
          fi

      - name: Save news history
        if: success()
        run: |
          if [ -f data/news-history.json ]; then

            git config user.name "Arasbaran News Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/news-history.json

            if git diff --cached --quiet; then
              echo "No history changes."
            else
              git commit -m "Update news history"
              git push
            fi

          else
            echo "No history file to save."
          fi
