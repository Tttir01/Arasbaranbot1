name: "      - name: Run Arasbaran News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TIMEZONE: Asia/Tehran
          MAX_ITEMS_PER_SOURCE: 10
          MAX_TOTAL_ITEMS: 30
          REQUEST_TIMEOUT: 25000
          DATA_FILE: data/news-history.json

        run: |
          echo "================================"
          echo "Starting Arasbaran News Bot"
          echo "================================"

          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

          echo "Checking environment..."

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is NOT available"
            exit 1
          else
            echo "TELEGRAM_BOT_TOKEN is available"
          fi

          if [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "ERROR: TELEGRAM_CHANNEL_ID is NOT available"
            exit 1
          else
            echo "TELEGRAM_CHANNEL_ID is available"
          fi

          echo "Checking project files:"
          ls -la
          echo "--------------------------------"

          echo "Checking src:"
          ls -la src
          echo "--------------------------------"

          echo "Checking config:"
          ls -la config
          echo "--------------------------------"

          echo "Running bot..."
          npm run run

          echo "================================"
          echo "News bot finished"
          echo "================================"

      - name: Check news history
        if: always()
        run: |
          echo "Checking history file..."

          if [ -f data/news-history.json ]; then
            echo "History file exists."
            ls -lh data/news-history.json
            echo "--------------------------------"
            head -50 data/news-history.json
          else
            echo "History file does not exist."
          fi

      - name: Save news history
        if: success()
        run: |
          if [ -f data/news-history.json ]; then

            git config user.name "Arasbaran News Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/news-history.json

            if git diff --cached --quiet; then
              echo "No history changes."
            else
              git commit -m "Update news history"
              git push
            fi

          else
            echo "No history file to save."
          fi
